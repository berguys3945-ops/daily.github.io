<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Profil Saya</title>
    <style>
        /* 1. MENGGANTI WARNA BACKGROUND & TEMA */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); /* Warna background gradasi estetik */
            min-height: 100vh;
            margin: 0;
            padding: 50px 20px;
            color: #333;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.85); /* Kotak transparan putih */
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* 2. MENGATUR FOTO PROFIL */
        .profile-img { 
            width: 110px; 
            height: 110px; 
            border-radius: 50%; 
            object-fit: cover; /* Agar foto tidak gepeng */
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 15px;
        }

        h1 { font-size: 22px; margin-bottom: 5px; color: #2c3e50; }
        p { font-size: 14px; color: #7f8c8d; margin-bottom: 25px; }

        /* 3. MENGGANTI WARNA TOMBOL & EFEK LAINNYA */
        .btn { 
            display: block; 
            margin: 12px 0; 
            padding: 14px; 
            background: #4a00e0; /* Warna dasar tombol (Ungu Tua) */
            color: white; 
            text-decoration: none; 
            border-radius: 50px; 
            font-weight: 600; 
            font-size: 15px;
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(74, 0, 224, 0.2);
        }
        
        /* Efek saat tombol disentuh/di-hover */
        .btn:hover { 
            background: #8e2de2; /* Berubah menjadi ungu lebih muda */
            transform: translateY(-2px); /* Tombol sedikit terangkat */
            box-shadow: 0 6px 20px rgba(142, 45, 226, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- PASANG FOTO PROFIL DI SINI -->
        <!-- Ganti URL gambar di bawah dengan link foto kamu sendiri -->
        <img src="https://unsplash.com" alt="Foto Profil" class="profile-img">
        
        <h1>Nama Kamu di Sini</h1>
        <p>Short bio / deskripsi singkat tentang kamu</p>

        <!-- MASUKKAN LINK MEDIA SOSIAL ASLIMU DI SINI -->
        <!-- Ganti tulisan di dalam href="..." dengan link media sosialmu -->
        <a href="https://instagram.com" class="btn" target="_blank">Instagram</a>
        <a href="https://linkedin.com" class="btn" target="_blank">LinkedIn</a>
        <a href="https://wa.me" class="btn" target="_blank">WhatsApp Saya</a>
    </div>

</body>
</html>

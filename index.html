<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Pribadi Saya</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 50px; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; background: #ddd; margin: 0 auto 20px; }
        h1 { color: #333; font-size: 24px; }
        .btn { display: block; width: 250px; margin: 15px auto; padding: 15px; background: #007bff; color: white; text-decoration: none; border-radius: 25px; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="profile-img"></div>
    <h1>Halo, Selamat Datang!</h1>
    <p>Temukan saya di media sosial berikut:</p>

    <!-- Kamu bisa ganti tanda # di bawah dengan link asli kamu nanti -->
    <a href="#" class="btn" target="_blank">Instagram</a>
    <a href="#" class="btn" target="_blank">LinkedIn</a>
    <a href="#" class="btn" target="_blank">TikTok / WhatsApp</a>

</body>
</html>
